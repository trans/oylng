name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The YAML 2.0 suite the tests pass against: trans/yaml2 at this commit.
# Move it forward when the suite changes and the parser has caught up.
env:
  YAML2_REF: 590d0a795af196971a6c831361ddde5ce23a36c7

jobs:
  test:
    name: Tests (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trans/yaml2
          ref: ${{ env.YAML2_REF }}
          path: yaml2

      # suite-to-data reads the suite's YAML with PyYAML
      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      # make test also runs both tests built without SIMD and the fast paths
      - name: Build and run the tests
        run: make CC=${{ matrix.cc }} SUITE=yaml2/suite test

  sanitize:
    name: Sanitizers (${{ matrix.cc }}, ASan + UBSan)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: trans/yaml2
          ref: ${{ env.YAML2_REF }}
          path: yaml2

      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }

      - name: Run the tests under the sanitizers
        run: make CC=${{ matrix.cc }} SUITE=yaml2/suite test-asan
